name: money_diary
description: แอปบันทึกรายรับรายจ่ายรายวัน เพิ่มหมวดหมู่เองได้ คำนวณยอดให้อัตโนมัติ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: any
  share_plus: any
  web: any
  shared_preferences: ^2.3.0
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  image_path_ios: "assets/icon/icon_square.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#006B56"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
